[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "shipit-csv-validator"
version = "0.1.0"
description = "Dependency-free local CSV validation with record, field and source diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
keywords = ["csv", "validation", "cli"]

[project.scripts]
shipit-csv-validate = "shipit_csv_validator.cli:main"

[project.urls]
Homepage = "https://csvfile.tools/validate"
Repository = "https://github.com/shipit-software/csv-validator"
Issues = "https://github.com/shipit-software/csv-validator/issues"

[tool.setuptools.packages.find]
where = ["src"]
